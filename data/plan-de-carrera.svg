<text x="126" y="724" font-size="15" font-weight="700" fill="#FBFCFA">META</text>
<text x="28" y="774" font-size="13" font-weight="600" fill="#A6521E">NUNCA un séptimo gel. 6 geles = 360 mg de cafeína = 4,3 mg/kg.</text>
<text x="28" y="797" font-size="13" font-weight="600" fill="#A6521E">Es ya 50 % más de lo máximo que has probado (4 geles = 240 mg).</text>
<text x="28" y="820" font-size="13" font-weight="600" fill="#131A17">Termo con TU suero hidratante de siempre. Sorbos constantes, ~500 ml por hora.</text>
<text x="28" y="843" font-size="13" font-weight="600" fill="#131A17">500 ml no cubren 6 h: lleva 2-3 sobres en el bolsillo y rearma en los puestos.</text>
<text x="28" y="866" font-size="13" font-weight="600" fill="#131A17">Los 248 g de sólidos van solos: el suero hidrata, no alimenta. NO le eches panela.</text>
<text x="28" y="889" font-size="13" font-weight="600" fill="#131A17">Si te empalaga el dulce: enjuaga con agua sola y sigue. NO dejes de comer.</text>
<text x="28" y="912" font-size="13" font-weight="600" fill="#0E4F52">km 0-10: 15-20 s/km MÁS LENTO de lo que te pida el cuerpo. Que te adelanten.</text>
<text x="28" y="949" font-size="12" fill="#5C6764">Desayuno 3:00 AM · 120 g de pan + 60 g de arequipe + café + 400 ml de agua con sal, limón y 40 g de panela = 132 g CHO</text>
